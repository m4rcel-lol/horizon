services:
  # OPTIONAL edge proxy. Not started by default — the app is published on
  # HTTP_PORT (25343) for a TLS proxy that already runs on the host, e.g. the
  # Caddy binary configured with infra/Caddyfile.host.
  #
  # Only if you want Docker to run the edge proxy too:
  #   docker compose --profile edge up -d
  caddy:
    image: caddy:2-alpine
    profiles:
      - edge
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./infra/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    environment:
      - CADDY_DOMAIN=${CADDY_DOMAIN:-tweeting.shop}
      - ACME_EMAIL=${ACME_EMAIL:-}
    depends_on:
      - api
      - web
    networks:
      - horizon

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    restart: unless-stopped
    env_file: .env
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER:-horizon}:${POSTGRES_PASSWORD:-horizon}@postgres:5432/${POSTGRES_DB:-horizon}?schema=public
      - REDIS_URL=redis://redis:6379
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_started
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/api/health/live"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 40s
    networks:
      - horizon
    volumes:
      - ./assets:/app/assets:ro

  worker:
    build:
      context: .
      dockerfile: apps/worker/Dockerfile
    restart: unless-stopped
    env_file: .env
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER:-horizon}:${POSTGRES_PASSWORD:-horizon}@postgres:5432/${POSTGRES_DB:-horizon}?schema=public
      - REDIS_URL=redis://redis:6379
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_started
    networks:
      - horizon
    volumes:
      - ./assets:/app/assets:ro

  # Serves the SPA and proxies /api, /ws and /media to the backing services, so
  # the entire site is reachable on one port. Published on the loopback
  # interface by default: the host's TLS proxy reaches it, the public internet
  # does not. Set HTTP_BIND_ADDR=0.0.0.0 only if the proxy lives on another host.
  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    restart: unless-stopped
    ports:
      - "${HTTP_BIND_ADDR:-127.0.0.1}:${HTTP_PORT:-25343}:80"
    environment:
      - STORAGE_BUCKET=${STORAGE_BUCKET:-horizon}
    depends_on:
      - api
    networks:
      - horizon

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-horizon}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-horizon}
      POSTGRES_DB: ${POSTGRES_DB:-horizon}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-horizon} -d ${POSTGRES_DB:-horizon}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - horizon

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - horizon

  minio:
    image: minio/minio:latest
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${STORAGE_ACCESS_KEY:-minioadmin}
      MINIO_ROOT_PASSWORD: ${STORAGE_SECRET_KEY:-minioadmin}
    volumes:
      - minio_data:/data
    # Loopback-only: media is served publicly through the web container's
    # /media route, and the console should never be exposed to the internet.
    ports:
      - "${MINIO_BIND_ADDR:-127.0.0.1}:9000:9000"
      - "${MINIO_BIND_ADDR:-127.0.0.1}:9001:9001"
    networks:
      - horizon

  minio-init:
    image: minio/mc:latest
    depends_on:
      - minio
    entrypoint: >
      /bin/sh -c "
      sleep 3;
      mc alias set local http://minio:9000 $${STORAGE_ACCESS_KEY:-minioadmin} $${STORAGE_SECRET_KEY:-minioadmin};
      mc mb --ignore-existing local/$${STORAGE_BUCKET:-horizon};
      mc anonymous set download local/$${STORAGE_BUCKET:-horizon};
      exit 0;
      "
    networks:
      - horizon
    profiles:
      - init

volumes:
  postgres_data:
  redis_data:
  minio_data:
  caddy_data:
  caddy_config:

networks:
  horizon:
    driver: bridge
